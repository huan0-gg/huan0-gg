<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none" role="img" aria-label="huan0-gg — student, learning AI and machine learning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#080b15"/>
      <stop offset="1" stop-color="#04050a"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.16" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.88" cy="0.9" r="0.62">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="80" y1="120" x2="640" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eaf9ff"/>
      <stop offset="0.42" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="80" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#7dd3fc" stroke-opacity="0.055" fill="none"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#9fe8ff" fill-opacity="0.018"/>
    </pattern>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; font-weight: 800; }
      .mono  { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; }
      @keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: .95 } }
      @keyframes drift  { 0%,100% { opacity: .35 } 50% { opacity: .8 } }
      @keyframes nodePulse { 0%,100% { opacity: .35; r: 3 } 50% { opacity: 1; r: 4.5 } }
      .halo   { animation: breathe 5.5s ease-in-out infinite; }
      .blob   { animation: drift 9s ease-in-out infinite; }
      .n1 { animation: nodePulse 3.4s ease-in-out infinite; }
      .n2 { animation: nodePulse 4.1s ease-in-out .5s infinite; }
      .n3 { animation: nodePulse 3.8s ease-in-out 1.1s infinite; }
      .n4 { animation: nodePulse 4.6s ease-in-out .9s infinite; }
      .n5 { animation: nodePulse 3.2s ease-in-out 1.4s infinite; }
      @keyframes sweep { 0% { transform: translateX(-320px) } 60%, 100% { transform: translateX(1560px) } }
      .sweep { animation: sweep 11s cubic-bezier(.4,0,.2,1) infinite; }
      @media (prefers-reduced-motion: reduce) { .halo, .blob, .n1, .n2, .n3, .n4, .n5, .sweep { animation: none; opacity: .7 } }
    </style>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect class="blob" width="1280" height="340" fill="url(#glowCyan)"/>
  <rect class="blob" width="1280" height="340" fill="url(#glowViolet)"/>
  <rect width="1280" height="340" fill="url(#scan)"/>
  <rect class="sweep" x="0" y="0" width="200" height="340" fill="url(#sweepGrad)"/>

  <!-- HUD brackets -->
  <g stroke="#22d3ee" stroke-width="1.4" stroke-opacity="0.5" fill="none">
    <path d="M28 60V28h32"/>
    <path d="M1220 28h32v32"/>
    <path d="M28 280v32h32"/>
    <path d="M1252 280v32h-32"/>
  </g>

  <!-- neural constellation -->
  <g stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.1">
    <path d="M946 232 L1004 196 L1088 150 L1166 168"/>
    <path d="M1004 196 L1042 118 L1136 96"/>
    <path d="M1088 150 L1136 96 L1166 168"/>
    <path d="M1042 118 L1088 150"/>
    <path d="M946 232 L1024 250 L1120 236 L1166 168"/>
  </g>
  <g fill="#7dd3fc" filter="url(#softGlow)">
    <circle class="n1" cx="946"  cy="232" r="3"/>
    <circle class="n2" cx="1004" cy="196" r="3"/>
    <circle class="n3" cx="1042" cy="118" r="3"/>
    <circle class="n4" cx="1088" cy="150" r="3"/>
    <circle class="n5" cx="1136" cy="96"  r="3"/>
    <circle class="n1" cx="1166" cy="168" r="3"/>
    <circle class="n4" cx="1024" cy="250" r="3"/>
    <circle class="n2" cx="1120" cy="236" r="3"/>
  </g>
  <g fill="#c4b5fd" filter="url(#softGlow)">
    <circle class="n3" cx="1088" cy="150" r="2.4"/>
    <circle class="n5" cx="1166" cy="168" r="2.4"/>
  </g>

  <!-- eyebrow -->
  <text class="mono" x="82" y="126" font-size="12.5" letter-spacing="4.2" fill="#5eead4" fill-opacity="0.85">// PROFILE</text>

  <!-- name -->
  <text class="title halo" x="78" y="196" font-size="88" letter-spacing="3" fill="#22d3ee" fill-opacity="0.5" filter="url(#glow)">HUAN0-GG</text>
  <text class="title" x="78" y="196" font-size="88" letter-spacing="3" fill="url(#titleGrad)">HUAN0-GG</text>

  <!-- rule -->
  <rect x="80" y="228" width="180" height="2" fill="url(#ruleGrad)"/>

  <!-- subtitle -->
  <text class="mono" x="82" y="262" font-size="15.5" letter-spacing="4.6" fill="#93a4bd">STUDENT</text>
  <circle cx="196" cy="257" r="2.6" fill="#38bdf8"/>
  <text class="mono" x="212" y="262" font-size="15.5" letter-spacing="4.6" fill="#93a4bd">AI / ML</text>
  <circle cx="330" cy="257" r="2.6" fill="#a78bfa"/>
  <text class="mono" x="346" y="262" font-size="15.5" letter-spacing="4.6" fill="#93a4bd">BUILDING IN PUBLIC</text>

  <!-- footer marks -->
  <text class="mono" x="1252" y="330" font-size="10.5" letter-spacing="3" fill="#333d4f" text-anchor="end">EST · 2026</text>
  <text class="mono" x="28" y="330" font-size="10.5" letter-spacing="3" fill="#333d4f">SYS · LEARNING</text>
</svg>
