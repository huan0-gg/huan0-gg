<svg xmlns="http://www.w3.org/2000/svg" width="880" height="100" viewBox="0 0 880 100" fill="none" role="img" aria-label="toolbox: python, numpy, pandas, pytorch, jupyter, git">
  <defs>
    <linearGradient id="pillEdge" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.7"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; }
      .pill { fill: rgba(125,211,252,0.05); stroke: url(#pillEdge); stroke-width: 1.3; }
      .lbl  { fill: #c8d6e8; font-size: 15px; letter-spacing: 2.4px; }
    </style>
  </defs>

  <g class="mono">
    <rect class="pill" x="26" y="24" width="129" height="52" rx="26"/>
    <circle cx="46" cy="50" r="3.2" fill="#22d3ee"/>
    <text class="lbl" x="62" y="55.5">PYTHON</text>

    <rect class="pill" x="170" y="24" width="118" height="52" rx="26"/>
    <circle cx="190" cy="50" r="3.2" fill="#38bdf8"/>
    <text class="lbl" x="206" y="55.5">NUMPY</text>

    <rect class="pill" x="303" y="24" width="129" height="52" rx="26"/>
    <circle cx="323" cy="50" r="3.2" fill="#38bdf8"/>
    <text class="lbl" x="339" y="55.5">PANDAS</text>

    <rect class="pill" x="447" y="24" width="140" height="52" rx="26"/>
    <circle cx="467" cy="50" r="3.2" fill="#a78bfa"/>
    <text class="lbl" x="483" y="55.5">PYTORCH</text>

    <rect class="pill" x="602" y="24" width="140" height="52" rx="26"/>
    <circle cx="622" cy="50" r="3.2" fill="#f0abfc"/>
    <text class="lbl" x="638" y="55.5">JUPYTER</text>

    <rect class="pill" x="757" y="24" width="97" height="52" rx="26"/>
    <circle cx="777" cy="50" r="3.2" fill="#fb923c"/>
    <text class="lbl" x="793" y="55.5">GIT</text>
  </g>
</svg>
