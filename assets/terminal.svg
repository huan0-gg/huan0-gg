<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" fill="none" role="img" aria-label="terminal card: whoami, focus, status">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="760" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080c15"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.5"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace; }
      @keyframes rise { from { transform: translateY(7px) } to { transform: translateY(0) } }
      @keyframes caret { 0%,45% { opacity: 1 } 55%,100% { opacity: 0 } }
      .l1 { animation: rise .5s ease-out backwards }
      .l2 { animation: rise .5s ease-out .16s backwards }
      .l3 { animation: rise .5s ease-out .32s backwards }
      .l4 { animation: rise .5s ease-out .48s backwards }
      .l5 { animation: rise .5s ease-out .64s backwards }
      .l6 { animation: rise .5s ease-out .80s backwards }
      .l7 { animation: rise .5s ease-out .96s backwards }
      .caret { animation: caret 1.1s step-end infinite }
      @media (prefers-reduced-motion: reduce) { .l1,.l2,.l3,.l4,.l5,.l6,.l7,.caret { animation: none } }
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="758.5" height="278.5" rx="14" fill="url(#win)" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M0.75 14.75A14 14 0 0 1 14.75 0.75h730.5a14 14 0 0 1 14 14V38H0.75V14.75Z" fill="#0a1120"/>
  <line x1="0.75" y1="38.75" x2="759.25" y2="38.75" stroke="#16233a" stroke-width="1"/>

  <circle cx="26" cy="20" r="5.5" fill="#ff5f57"/>
  <circle cx="46" cy="20" r="5.5" fill="#febc2e"/>
  <circle cx="66" cy="20" r="5.5" fill="#28c840"/>
  <text class="mono" x="380" y="25" font-size="12" letter-spacing="1.6" fill="#5b6b84" text-anchor="middle">~/about — zsh</text>

  <rect x="620" y="52" width="112" height="24" rx="12" fill="#0e1a2e" stroke="#1e3350"/>
  <circle cx="634" cy="64" r="3" fill="#34d399"/>
  <text class="mono" x="644" y="68.5" font-size="10.5" letter-spacing="1.6" fill="#7f92ab">LEARNING</text>

  <g class="mono" font-size="15">
    <g class="l1">
      <text x="28" y="96" fill="#22d3ee">$</text>
      <text x="48" y="96" fill="#dbe7f5">whoami</text>
    </g>
    <g class="l2">
      <text x="48" y="124" fill="#8b9bb4">student — learning in public</text>
    </g>
    <g class="l3">
      <text x="28" y="152" fill="#22d3ee">$</text>
      <text x="48" y="152" fill="#dbe7f5">cat focus.txt</text>
    </g>
    <g class="l4">
      <text x="48" y="180" fill="#8b9bb4">python · numpy · pytorch · math for ml</text>
    </g>
    <g class="l5">
      <text x="28" y="208" fill="#22d3ee">$</text>
      <text x="48" y="208" fill="#dbe7f5">echo $STATUS</text>
    </g>
    <g class="l6">
      <text x="48" y="236" fill="#5eead4">open to collaborate</text>
    </g>
    <g class="l7">
      <text x="28" y="264" fill="#22d3ee">$</text>
      <rect class="caret" x="48" y="251" width="8.5" height="16" fill="#7dd3fc"/>
    </g>
  </g>
</svg>
